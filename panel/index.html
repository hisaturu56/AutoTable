<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ポロライドテーブル自動作成</title>
<style>
  :root { --bg: #323232; --fg: #e0e0e0; --btn: #454545; --btn-hover: #555555; --line: #5a5a5a; --note: #a0a0a0; }
  body { margin: 0; padding: 10px; background: var(--bg); color: var(--fg);
         font-family: "Yu Gothic UI", "Meiryo UI", sans-serif; font-size: 12px; }
  button { display: block; width: 100%; margin: 0 0 8px; padding: 9px 6px; border: 1px solid var(--line);
           border-radius: 3px; background: var(--btn); color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { background: var(--btn-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  .note { color: var(--note); font-size: 11px; line-height: 1.5; }
  #status { min-height: 1.5em; }
</style>
</head>
<body>
  <button data-script="create_table.jsx">表を作る</button>
  <button data-script="adjust_images.jsx">キャラ画像の調整</button>
  <button data-script="export_png.jsx">PNG で書き出す</button>
  <div class="note">アートボードが複数あるときは、どれを書き出すか選べます</div>
  <div id="status" class="note"></div>

<script>
  // パネルのボタンから、jsx フォルダのスクリプト（今までと同じもの）を Illustrator で実行する
  var cep = window.__adobe_cep__;

  // Illustrator の明るさ設定に合わせて背景色を変える
  try {
    var skin = JSON.parse(cep.getHostEnvironment()).appSkinInfo.panelBackgroundColor.color;
    var bg = "rgb(" + Math.round(skin.red) + "," + Math.round(skin.green) + "," + Math.round(skin.blue) + ")";
    document.documentElement.style.setProperty("--bg", bg);
    if (skin.red > 128) {
      document.documentElement.style.setProperty("--fg", "#222222");
      document.documentElement.style.setProperty("--btn", "#e8e8e8");
      document.documentElement.style.setProperty("--btn-hover", "#f5f5f5");
      document.documentElement.style.setProperty("--line", "#b0b0b0");
      document.documentElement.style.setProperty("--note", "#555555");
    }
  } catch (e) {}

  // このパネルのフォルダ（index.html のある場所）
  function extensionFolder() {
    var path = decodeURI(location.href.replace(/[?#].*$/, "").replace(/\/[^\/]*$/, ""));
    return path.replace(/^file:\/\/\/(?=[A-Za-z]:)/, "").replace(/^file:\/\//, "");
  }

  var status = document.getElementById("status");
  var buttons = document.querySelectorAll("button[data-script]");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener("click", function () {
      if (!cep) { status.textContent = "Illustrator の中で開いてください。"; return; }
      var file = extensionFolder() + "/jsx/" + this.getAttribute("data-script");
      var script = 'try { $.evalFile(new File(' + JSON.stringify(file) + ')); "ok"; }'
                 + ' catch (e) { "エラー：" + e.message + "（" + e.line + " 行目）"; }';
      setBusy(true);
      cep.evalScript(script, function (result) {
        setBusy(false);
        status.textContent = result && result !== "ok" && result !== "undefined" ? result : "";
      });
    });
  }

  function setBusy(busy) {
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = busy;
    status.textContent = busy ? "実行中…（開いた画面を閉じると戻ります）" : status.textContent;
  }
</script>
</body>
</html>
